<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedReview — Revisão Interativa de Medicina (FSRS-5)</title>
    <meta name="description" content="Flashcards de medicina com motor FSRS-5 de repetição espaçada" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Invalidação global de cache para sincronizar 1.352 cartas e sincronização em tempo real
      const CURRENT_APP_CACHE_VERSION = 'mr_cache_v20261008_realtime_v4';
      try {
        if (localStorage.getItem('mr_cache_version') !== CURRENT_APP_CACHE_VERSION) {
          if (window.indexedDB) {
            window.indexedDB.deleteDatabase('medreview_cache_db');
            window.indexedDB.deleteDatabase('medreview_local_cache');
          }
          const keysToRemove = [
            'mr_cached_decks',
            'mr_cached_cards',
            'mr_cached_meta_cards',
            'mr_cached_reviews',
            'mr_restored_clean_v6',
            'mr_frontline_decks_v1',
            'mr_deleted_cards_v1',
            'mr_deleted_decks_v1',
          ];
          keysToRemove.forEach((k) => localStorage.removeItem(k));
          localStorage.setItem('mr_cache_version', CURRENT_APP_CACHE_VERSION);
        }
      } catch (e) {}

      // Desregistra Service Workers antigos e limpa caches defasados para eliminar tela branca permanentemente
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister().catch(() => {})
          }
        }).catch(() => {})
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            caches.delete(key).catch(() => {})
          }
        }).catch(() => {})
      }
    </script>
  </body>
</html>
