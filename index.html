    <script>
      (function() {
        try {
          var t = localStorage.getItem('mr_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Invalidação global de cache para sincronizar 1.352 cartas e sincronização em tempo real
      const CURRENT_APP_CACHE_VERSION = 'mr_cache_v20261009_clean_1352_v1';
      try {
        if (localStorage.getItem('mr_cache_version') !== CURRENT_APP_CACHE_VERSION) {
          if (window.indexedDB) {
            window.indexedDB.deleteDatabase('medreview_cache_db');
            window.indexedDB.deleteDatabase('medreview_local_cache');
          }
          const keysToRemove = [
            'mr_cached_decks',
            'mr_cached_cards',
            'mr_cached_meta_cards',
            'mr_cached_reviews',
            'mr_restored_clean_v6',
            'mr_frontline_decks_v1',
            'mr_deleted_cards_v1',
            'mr_deleted_decks_v1',
          ];
          keysToRemove.forEach((k) => localStorage.removeItem(k));
          localStorage.setItem('mr_cache_version', CURRENT_APP_CACHE_VERSION);
        }
      } catch (e) {}

      // Registro moderno do Service Worker para suporte PWA 100% offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] Service Worker offline ativo:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] Falha ao registrar Service Worker:', err);
          });
        });
      }
    </script>
  </body>
