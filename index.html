<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 flex flex-col items-center">
        <h1 class="text-3xl font-bold mb-6 text-indigo-600">Meus Flashcards</h1>
        
        <!-- Progress -->
        <div class="w-full mb-4 flex justify-between text-sm font-medium text-slate-500">
            <span id="card-counter">1 / 1</span>
        </div>

        <!-- Flashcard -->
        <div class="flashcard-container w-full aspect-[4/3] cursor-pointer perspective" id="flashcard">
            <div class="flashcard-inner w-full h-full relative preserve-3d transition-transform duration-500 rounded-xl shadow-md" id="flashcard-inner">
                <!-- Front -->
                <div class="flashcard-front absolute w-full h-full bg-indigo-50 rounded-xl flex items-center justify-center p-6 text-center border-2 border-indigo-100 backface-hidden">
                    <p id="card-front-text" class="text-xl md:text-2xl font-semibold text-slate-700"></p>
                </div>
                <!-- Back -->
                <div class="flashcard-back absolute w-full h-full bg-indigo-600 rounded-xl flex items-center justify-center p-6 text-center backface-hidden rotate-y-180">
                    <p id="card-back-text" class="text-xl md:text-2xl font-medium text-white"></p>
                </div>
            </div>
        </div>
        
        <p class="text-sm text-slate-400 mt-4 mb-6 text-center">Clique no card para virar</p>

        <!-- Controls -->
        <div class="flex justify-between w-full gap-4">
            <button id="btn-prev" class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Anterior
            </button>
            <button id="btn-next" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Próximo
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
