<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedReview — Revisão Interativa de Medicina (FSRS-5)</title>
    <meta name="description" content="Flashcards de medicina com motor FSRS-5 de repetição espaçada" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16a34a" />
    <!-- Suporte nativo PWA para iPhone / iPad e Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedReview" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mr_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Invalidação global de cache para sincronizar 1.352 cartas e sincronização em tempo real
      const CURRENT_APP_CACHE_VERSION = 'mr_cache_v20261009_clean_1352_v1';
      try {
        if (localStorage.getItem('mr_cache_version') !== CURRENT_APP_CACHE_VERSION) {
          if (window.indexedDB) {
            window.indexedDB.deleteDatabase('medreview_cache_db');
            window.indexedDB.deleteDatabase('medreview_local_cache');
          }
          const keysToRemove = [
            'mr_cached_decks',
            'mr_cached_cards',
            'mr_cached_meta_cards',
            'mr_cached_reviews',
            'mr_restored_clean_v6',
            'mr_frontline_decks_v1',
            'mr_deleted_cards_v1',
            'mr_deleted_decks_v1',
          ];
          keysToRemove.forEach((k) => localStorage.removeItem(k));
          localStorage.setItem('mr_cache_version', CURRENT_APP_CACHE_VERSION);
        }
      } catch (e) {}

      // Registro moderno do Service Worker para suporte PWA 100% offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] Service Worker offline ativo:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] Falha ao registrar Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
